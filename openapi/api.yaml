openapi: 3.0.3
info:
  title: fullstack-lab Task API
  version: 1.1.0
  description: タスクの業務 API。BFF からのみ呼ばれる内部サービス。
servers:
  - url: http://api:8080
tags:
  - name: tasks
paths:
  /api/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: タスク一覧
      parameters:
        - name: ownerId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 新しい順
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      tags: [tasks]
      operationId: createTask
      summary: タスク登録
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserName'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: 登録済み
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/Problem'
  /api/tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: タスク詳細
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: タスク
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404':
          $ref: '#/components/responses/Problem'
  /api/tasks/{id}/due-date-info:
    get:
      tags: [tasks]
      operationId: getTaskDueDateInfo
      summary: 期限日の補足情報
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 補足情報
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DueDateInfo' }
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/tasks/{id}/completion:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: タスクを完了にする（冪等。既に完了していれば何もせず現状を返す）
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 完了後のタスク（completedAt が入る）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string }
    UserName:
      name: X-User-Name
      in: header
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: エラー（RFC 9457）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    Task:
      type: object
      required: [id, title, createdBy, createdByName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        createdBy: { type: string }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true, description: 完了日時。null なら未完了 }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
    DueDateInfo:
      type: object
      required: [date, businessDay]
      properties:
        date: { type: string, format: date }
        businessDay: { type: boolean }
        holidayName: { type: string, nullable: true }
    ProblemDetail:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
